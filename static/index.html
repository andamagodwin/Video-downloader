<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e11d48'/%3E%3Cpath d='M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M10 23h12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M6 19.5h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>Video Downloader</h1>
        <p class="tagline">Paste a YouTube link and save it as video or audio.</p>
      </div>
    </header>

    <form id="url-form" class="search" autocomplete="off" novalidate>
      <label for="url" class="sr-only">YouTube link</label>
      <input id="url" type="url" inputmode="url" spellcheck="false"
             placeholder="https://www.youtube.com/watch?v=…" aria-describedby="form-msg">
      <button id="fetch-btn" type="submit" class="btn primary">Get video</button>
    </form>
    <p id="form-msg" class="form-msg" role="status" aria-live="polite"></p>

    <section id="preview" class="card preview" hidden aria-live="polite">
      <div class="thumb">
        <img id="pv-thumb" alt="" referrerpolicy="no-referrer">
        <span id="pv-duration" class="duration" hidden></span>
      </div>
      <div class="pv-body">
        <h2 id="pv-title" class="pv-title"></h2>
        <p id="pv-meta" class="meta"></p>

        <div class="choose">
          <div class="group">
            <span class="group-label" id="video-label">Video <small>MP4</small></span>
            <div id="pv-video" class="pills" role="radiogroup" aria-labelledby="video-label"></div>
          </div>
          <div class="group" id="audio-group">
            <span class="group-label" id="audio-label">Audio only</span>
            <div id="pv-audio" class="pills" role="radiogroup" aria-labelledby="audio-label"></div>
          </div>
        </div>

        <p id="pv-note" class="note" hidden></p>
        <button id="dl-btn" type="button" class="btn primary wide">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M6 19.5h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Download</span>
        </button>
      </div>
    </section>

    <section class="downloads" aria-labelledby="downloads-title">
      <div class="section-head">
        <h2 id="downloads-title">Downloads</h2>
        <div class="head-actions">
          <button id="clear-btn" type="button" class="btn ghost small" hidden>Clear finished</button>
          <button id="open-folder" type="button" class="btn ghost small">Open folder</button>
        </div>
      </div>
      <ul id="jobs" class="jobs"></ul>
      <div id="empty" class="empty">
        <p>Nothing downloaded yet.</p>
        <p class="dir">Files are saved to <code id="dir">…</code></p>
      </div>
    </section>

    <footer>Only download videos you own or have permission to save.</footer>
  </main>

  <template id="job-tpl">
    <li class="job">
      <div class="job-thumb"><img alt="" loading="lazy" referrerpolicy="no-referrer"></div>
      <div class="job-body">
        <div class="job-head">
          <p class="job-title"></p>
          <span class="tag"></span>
        </div>
        <div class="bar"><span class="fill"></span></div>
        <div class="job-foot">
          <p class="job-status"></p>
          <div class="job-actions"></div>
        </div>
      </div>
    </li>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
